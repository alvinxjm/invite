<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hey Isabelle ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root { --cardW: 520px; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      text-align: center;
      color: #333;
      padding: 18px;
      box-sizing: border-box;
    }

    .card {
      background: white;
      padding: 26px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      max-width: var(--cardW);
      width: 100%;
      position: relative;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 5.5vw, 34px);
    }

    .details {
      font-size: clamp(15px, 3.8vw, 18px);
      margin: 14px 0 18px;
      line-height: 1.55;
    }

    .buttons {
      position: relative;
      height: 140px; /* space for dodging */
      max-width: 360px;
      margin: 0 auto;
      touch-action: manipulation;
    }

    button {
      width: 100%;
      padding: 14px 18px;
      font-size: 18px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #yes {
      background: #ff4d6d;
      color: white;
      position: absolute;
      left: 0;
      top: 0;
      z-index: 2;
    }

    #yes:active { transform: scale(0.98); }

    #no {
      background: #e0e0e0;
      color: #555;
      position: absolute;
      left: 0;
      top: 76px; /* starts below YES */
      z-index: 1;
    }

    .footer {
      margin-top: 16px;
      font-size: 14px;
      opacity: 0.8;
    }

    /* Smaller phones */
    @media (max-width: 360px) {
      .buttons { height: 150px; }
      button { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hey Isabelle 💖</h1>

    <div class="details">
      It’s our <strong>Valentine’s Day + monthsary</strong> 🥰<br><br>
      📅 <strong>Wednesday, 11 February 2026</strong><br>
      ⏰ <strong>7:00 PM</strong><br>
      📍 <strong>Location:</strong> Let you know 😉<br><br>
      Isabelle, will you go out with me?
    </div>

    <div class="buttons" id="arena">
      <button id="yes" onclick="sayYes()">YES 💘</button>
      <button id="no" type="button">No 🙄</button>
    </div>

    <div class="footer">— Alvin</div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const arena = document.getElementById("arena");
    let noClicks = 0;

    const guiltTexts = [
      "No 🙄",
      "Are you sure?",
      "Really sure?",
      "This hurts 😢",
      "Wow ok 😭",
      "My heart 💔",
      "Isabelle pls 🥺",
      "Just say yes",
      "WHY",
      "…"
    ];

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    function moveNo() {
      const a = arena.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      // Keep the NO button fully inside the arena
      const maxX = a.width - b.width;
      const maxY = a.height - b.height;

      // Make it progressively smaller (but not invisible)
      const scale = clamp(1 - noClicks * 0.12, 0.32, 1);
      noBtn.style.transform = `scale(${scale})`;

      // After scaling, approximate bounds by using scale on positions too
      // (good enough for a playful UI)
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = `${x}px`;
      noBtn.style.top  = `${y}px`;
    }

    // Desktop: dodge on hover
    noBtn.addEventListener("mouseenter", moveNo);

    // Mobile: dodge when finger gets close / touches
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();  // prevents "click" from firing immediately
      noClicks++;
      noBtn.innerText = guiltTexts[Math.min(noClicks, guiltTexts.length - 1)];
      moveNo();
    }, { passive: false });

    // Also dodge on click (desktop or if touchstart didn't catch)
    noBtn.addEventListener("click", () => {
      noClicks++;
      noBtn.innerText = guiltTexts[Math.min(noClicks, guiltTexts.length - 1)];
      moveNo();
    });

    function sayYes() {
      const message = encodeURIComponent(
        "Hi Alvin ❤️ I accept your Valentine’s + monthsary invite on Wednesday, 11 Feb 2026 at 7pm 😘"
      );
      window.location.href = `https://t.me/alvinmjx?text=${message}`;
    }
  </script>
</body>
</html>
